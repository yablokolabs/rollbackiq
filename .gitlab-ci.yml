# RollbackIQ CI.
#
# Stages carry the real lifecycle: the attribution guard, a real image build,
# a real deployment that is only accepted when it passes a health gate, a
# deliberate regression, a human approval, a safety-gated rollback, and an
# independent verification of recovery.
#
# Two properties are deliberate and worth stating because they are easy to get
# wrong:
#
#   * GitLab jobs run on separate ephemeral runners, so a container started in
#     one job does not exist in the next. State that must survive travels as
#     job artifacts, and each job re-establishes the deployment it needs. The
#     incident bundle, the approval and the rollback evidence are all artifacts.
#   * The rollback job does not decide for itself. It runs the control plane's
#     SafetyGate over the incident bundle, so the rules that protect the
#     rollback are the same ones the test suite exercises. Any veto refuses.
#
# The `demo-staging` environment is an isolated demo target. Nothing here is
# wired to a customer system, and no job restores deleted data.

stages:
  - verify
  - build
  - deploy
  - operate

variables:
  # One image serves both releases; a release is a set of deployment inputs, not
  # a different build. That is what makes "roll back" a change of inputs.
  WORKLOAD_IMAGE: "$CI_REGISTRY_IMAGE/workload:$CI_COMMIT_SHA"
  DEPLOY_ENV: "demo-staging"
  DOCKER_NETWORK: "rollbackiq-ci"
  WORKLOAD_CONTAINER: "rollbackiq-workload"

# Shared docker-in-docker setup for the jobs that run the workload.
.docker-dind:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache python3 py3-pip
    # The release, incident and rollback scripts use the control plane's typed
    # models and the verifier, so the job installs the same requirements.
    - pip install --break-system-packages --quiet -r backend/requirements.txt

# The control-plane scripts need only Python; this keeps the approval job light.
.python:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir -r backend/requirements.txt

# Fails the pipeline if any committed file or commit message contains an AI
# attribution footer, trailer or assistant signature (AGENTS.md section 10).
# Uses the same scanner as the local Git hooks, so there is one rule to update.
attribution-guard:
  stage: verify
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash grep git coreutils
  script:
    - echo "Scanning tracked and untracked files for attribution footers"
    - bash scripts/check_no_attribution.sh files
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      case "$base" in
        ""|0000000000000000000000000000000000000000) base="" ;;
      esac
      if [ -n "$base" ]; then
        echo "Scanning commit messages in $base..$CI_COMMIT_SHA"
        bash scripts/check_no_attribution.sh range "$base..$CI_COMMIT_SHA"
      else
        echo "Scanning commit messages reachable from $CI_COMMIT_SHA"
        bash scripts/check_no_attribution.sh range "$CI_COMMIT_SHA"
      fi

# Builds the workload image and publishes its immutable digest. The digest is
# the identity a rollback is allowed to target, so it is captured here and
# passed forward as an artifact rather than re-derived from a moving tag.
build:workload-image:
  stage: build
  extends: .docker-dind
  script:
    - docker build --build-arg RELEASE_VERSION=v1 -t "$WORKLOAD_IMAGE" ./demo/service
    - docker push "$WORKLOAD_IMAGE"
    - |
      DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$WORKLOAD_IMAGE" | sed 's/.*@//')
      if [ -z "$DIGEST" ] || [ "$DIGEST" = "$WORKLOAD_IMAGE" ]; then
        echo "could not resolve an immutable digest for $WORKLOAD_IMAGE" >&2
        exit 1
      fi
      printf '%s\n' "$DIGEST" > image-digest.txt
      echo "workload image digest: $DIGEST"
  artifacts:
    expire_in: 1 week
    paths:
      - image-digest.txt

# Real deployment of the healthy release, gated on its own health. The probe
# here also captures the healthy baseline the detector and the verifier are
# compared against later.
deploy:staging:
  stage: deploy
  extends: .docker-dind
  needs: ["build:workload-image"]
  environment:
    name: demo-staging
  script:
    - docker pull "$WORKLOAD_IMAGE"
    - DIGEST=$(cat image-digest.txt)
    - |
      python3 scripts/ci_release.py deploy \
        --image "$WORKLOAD_IMAGE" --release v1 --container "$WORKLOAD_CONTAINER" \
        --network "$DOCKER_NETWORK" --environment "$DEPLOY_ENV" \
        --commit-sha "$CI_COMMIT_SHA" --pipeline-id "$CI_PIPELINE_ID" --digest "$DIGEST" \
        --out evidence/deploy-healthy.json
    - |
      python3 scripts/ci_release.py probe \
        --target "$WORKLOAD_CONTAINER:8000" --in-container "$WORKLOAD_IMAGE" \
        --network "$DOCKER_NETWORK" --samples 150 --concurrency 8 \
        --environment "$DEPLOY_ENV" --expect-release v1 --expect-healthy \
        --out evidence/baseline-window.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/

# Deploys the deliberately regressed release and requires the real detector to
# fire before an incident exists. If nothing is detected the job fails and
# writes no bundle, so no incident can be manufactured from a healthy release.
deploy:regressed:
  stage: deploy
  extends: .docker-dind
  needs: ["build:workload-image", "deploy:staging"]
  when: manual
  environment:
    name: demo-staging
  script:
    - docker pull "$WORKLOAD_IMAGE"
    - DIGEST=$(cat image-digest.txt)
    - |
      python3 scripts/ci_incident.py regress \
        --image "$WORKLOAD_IMAGE" --network "$DOCKER_NETWORK" \
        --environment "$DEPLOY_ENV" --commit-sha "$CI_COMMIT_SHA" \
        --pipeline-id "$CI_PIPELINE_ID" --digest "$DIGEST" \
        --healthy-commit-sha "$CI_COMMIT_SHA" --healthy-pipeline-id "$CI_PIPELINE_ID" \
        --healthy-digest "$DIGEST" \
        --baseline evidence/baseline-window.json \
        --workdir evidence \
        --deploy-out evidence/deploy-regressed.json \
        --detection-out evidence/ci-detection.json \
        --out evidence/incident-bundle.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/

# The human approval. This is a manual job, so the actor is the GitLab user who
# actually started it (`GITLAB_USER_LOGIN`), and the approval is scoped to the
# exact proposal hash. A denial records a denial; nothing here can approve on
# somebody else's behalf.
approval:grant:
  stage: operate
  extends: .python
  needs: ["deploy:regressed"]
  when: manual
  environment:
    name: demo-staging
  script:
    - |
      echo "approval being recorded for GitLab user: ${GITLAB_USER_LOGIN:-unknown}"
      python scripts/ci_incident.py approve \
        --bundle evidence/incident-bundle.json \
        --actor "${GITLAB_USER_LOGIN:-unknown}" \
        --ttl 900 \
        --note "played by ${GITLAB_USER_LOGIN:-unknown} in pipeline $CI_PIPELINE_ID" \
        --out evidence/approval.json
    - |
      python scripts/ci_incident.py combine \
        --bundle evidence/incident-bundle.json \
        --approval evidence/approval.json \
        --out evidence/incident-bundle-approved.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/

# The gated rollback. It is manual, it runs only against the isolated
# demo-staging environment, and it refuses unless the safety gate passes on
# every check: allowlisted environment, known-good target, a real human
# approval in scope and unexpired, an unused idempotency key, and an image
# digest that matches the artifact the target release was verified with.
#
# Use ROLLBACK_DRY_RUN=1 to evaluate the gate without changing anything.
rollback:managed:
  stage: operate
  extends: .docker-dind
  needs: ["build:workload-image", "approval:grant"]
  when: manual
  environment:
    name: demo-staging
  variables:
    ROLLBACK_DRY_RUN: "0"
  script:
    - docker pull "$WORKLOAD_IMAGE"
    - |
      FLAGS=""
      if [ "$ROLLBACK_DRY_RUN" = "1" ]; then FLAGS="--dry-run"; fi
      python3 scripts/ci_rollback.py \
        --bundle evidence/incident-bundle-approved.json \
        --image "$WORKLOAD_IMAGE" \
        --container "$WORKLOAD_CONTAINER" \
        --network "$DOCKER_NETWORK" \
        --environment "$DEPLOY_ENV" \
        --allowed-environments "$DEPLOY_ENV" \
        --protected-environments "$DEPLOY_ENV" \
        --out evidence/rollback-execution.json \
        $FLAGS
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/

# Independent verification, as its own job. A job that reports its own success
# is not evidence, so this deploys the target release again and measures a new
# window that starts after the rollback executed, then fails the pipeline
# unless recovery is actually proven against the baseline.
verify:recovery:
  stage: operate
  extends: .docker-dind
  needs: ["build:workload-image", "rollback:managed"]
  environment:
    name: demo-staging
  script:
    - docker pull "$WORKLOAD_IMAGE"
    - DIGEST=$(cat image-digest.txt)
    - |
      python3 scripts/ci_release.py deploy \
        --image "$WORKLOAD_IMAGE" --release v1 --container "$WORKLOAD_CONTAINER-verify" \
        --network "$DOCKER_NETWORK" --environment "$DEPLOY_ENV" \
        --commit-sha "$CI_COMMIT_SHA" --pipeline-id "$CI_PIPELINE_ID" --digest "$DIGEST" \
        --out evidence/deploy-verify.json
    - |
      python3 scripts/ci_release.py probe \
        --target "$WORKLOAD_CONTAINER-verify:8000" --in-container "$WORKLOAD_IMAGE" \
        --network "$DOCKER_NETWORK" --samples 200 --concurrency 4 \
        --environment "$DEPLOY_ENV" --expect-release v1 \
        --out evidence/verify-window.json
    - |
      python3 scripts/ci_release.py verify \
        --baseline evidence/baseline-window.json \
        --after evidence/verify-window.json \
        --expected-release v1 \
        --rollback-evidence evidence/rollback-execution.json \
        --out evidence/verification.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/

# Sends real OpenTelemetry spans from a runner to the group's GitLab
# Observability collector, by starting the workload exactly as it is deployed
# and driving genuine HTTP traffic through it. The job is manual because it
# produces telemetry, not because it is optional: it exists so the export path
# can be re-proven on a GitLab runner rather than only on a laptop.
#
# CI/CD telemetry for pipelines themselves is a separate, group-level switch:
# set GITLAB_OBSERVABILITY_EXPORT to metrics,logs,traces in the group's CI/CD
# variables (see the group's Observability page).
telemetry-spike:
  stage: operate
  image: python:3.12-slim
  when: manual
  allow_failure: true
  variables:
    # Not a secret: the group's collector endpoint. Override with a group or
    # project CI/CD variable of the same name if the workspace changes.
    OTEL_EXPORTER_OTLP_ENDPOINT: "https://144345494.otel.gitlab-o11y.com:14318"
    OTEL_SERVICE_NAME: "rollbackiq-demo-workload"
    CI_PROJECT_ID: "$CI_PROJECT_ID"
    CI_PROJECT_NAME: "$CI_PROJECT_NAME"
  script:
    - pip install --quiet --no-cache-dir -r demo/service/requirements.txt
    - python scripts/otel_export_evidence.py --requests 12 --out evidence/otel-export-ci.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evidence/otel-export-ci.json
